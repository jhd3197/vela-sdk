name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  component:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements-check.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/automation.py build
      - run: python scripts/verify.py
