name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional MAJOR.MINOR.PATCH; blank chooses the next version'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: component-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
      build_ref: ${{ steps.release.outputs.build_ref }}
      date: ${{ steps.release.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python scripts/automation.py prepare --version "$REQUESTED_VERSION"
  build:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements-check.txt
      - name: Stamp the tested version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
        run: python scripts/automation.py stamp --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
      - run: python -m unittest discover -s tests
      - run: python scripts/automation.py build
      - run: python scripts/verify.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/*.zip
            dist/*.tgz
            dist/*.json
            dist/*.sha256
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.build_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: .local/release-assets
      - name: Publish verified assets and release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
          RELEASE_SOURCE: ${{ needs.prepare.outputs.source }}
        run: |
          python scripts/automation.py stamp --version "$RELEASE_VERSION" --date "$RELEASE_DATE"
          python scripts/automation.py publish --version "$RELEASE_VERSION" --source "$RELEASE_SOURCE" --artifacts .local/release-assets
